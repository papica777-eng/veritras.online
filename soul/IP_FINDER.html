<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETERNA | IP-FINDER VIVISECTOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #050508; color: #d1d5db; overflow-x: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); }
        .glow-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.5); }
        #map { height: 500px; border-radius: 1rem; border: 1px solid rgba(6, 182, 212, 0.2); }
        .leaflet-container { background: #050508 !important; }
        .scan-line { position: absolute; height: 1px; width: 100%; background: rgba(6, 182, 212, 0.2); animation: scan 8s linear infinite; pointer-events: none; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .terminal-text { animation: typing 0.5s steps(30, end); }
        @keyframes typing { from { width: 0 } to { width: 100% } }
    </style>
</head>
<body class="min-h-screen selection:bg-cyan-500 selection:text-black">
    <div class="scan-line"></div>

    <!-- Header -->
    <nav class="glass border-b border-white/5 p-6 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="p-2 bg-black border border-cyan-500/50 rounded-lg shadow-[0_0_15px_rgba(6,182,212,0.2)]">
                <i data-lucide="crosshair" class="text-cyan-500 w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-xl font-black text-white tracking-tighter uppercase">IP-FINDER <span class="text-cyan-500">VIVISECTOR</span></h1>
                <div class="text-[9px] text-cyan-500 tracking-widest mono">CLUSTER_LOCALIZATION_PROTOCOL_V4</div>
            </div>
        </div>
        <div class="mono text-[10px] text-gray-500 flex gap-6">
            <div class="flex flex-col"><span class="text-white font-bold">MODE</span> <span>DETERMINISTIC</span></div>
            <div class="flex flex-col"><span class="text-white font-bold">SYNC</span> <span class="text-green-500">7.83HZ</span></div>
        </div>
    </nav>

    <main class="p-8 max-w-7xl mx-auto space-y-8">
        <!-- Control Panel -->
        <div class="grid lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="glass p-8 rounded-2xl glow-border">
                    <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-6 flex items-center gap-2">
                        <i data-lucide="target" class="w-3 h-3 text-cyan-500"></i> Target Ingress
                    </h3>
                    <div class="space-y-4">
                        <div class="relative">
                            <input type="text" id="ip-input" placeholder="0.0.0.0" class="w-full bg-black/50 border border-white/10 rounded-xl p-4 text-white mono focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition-all placeholder:text-gray-700">
                        </div>
                        <button onclick="vivisectIP()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-black py-4 rounded-xl uppercase tracking-widest text-xs transition-all flex items-center justify-center gap-2">
                            <i data-lucide="zap" class="w-4 h-4"></i> Execute Vivisection
                        </button>
                    </div>
                </div>

                <div class="glass p-8 rounded-2xl">
                    <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-6">Cluster Metadata</h3>
                    <div id="metadata" class="space-y-4 mono text-[11px]">
                        <div class="flex justify-between border-b border-white/5 pb-2">
                            <span class="text-gray-600">STATUS</span>
                            <span class="text-gray-400">AWAITING_INGESTION</span>
                        </div>
                        <div class="flex justify-between border-b border-white/5 pb-2">
                            <span class="text-gray-600">HOSTING</span>
                            <span class="text-gray-400">---</span>
                        </div>
                        <div class="flex justify-between border-b border-white/5 pb-2">
                            <span class="text-gray-600">ASN</span>
                            <span class="text-gray-400">---</span>
                        </div>
                        <div class="flex justify-between border-b border-white/5 pb-2">
                            <span class="text-gray-600">CERTAINTY</span>
                            <span class="text-gray-400">0.00%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Map View -->
            <div class="lg:col-span-2">
                <div class="glass rounded-2xl overflow-hidden relative">
                    <div id="map"></div>
                    <div class="absolute bottom-4 left-4 z-[1000] glass px-4 py-2 rounded-lg mono text-[10px] text-cyan-500 border border-cyan-500/30">
                        GEOLOCATION_ENGINE: ACTIVE
                    </div>
                </div>
            </div>
        </div>

        <!-- Terminal Output -->
        <div class="glass p-6 rounded-2xl h-48 overflow-y-auto mono text-[11px] space-y-1 scrollbar-hide bg-black/30" id="terminal">
            <div class="text-cyan-900">[SYSTEM] AETERNA IP-FINDER INITIALIZED.</div>
            <div class="text-cyan-900">[SYSTEM] KERNEL_LOCK AT 7.83HZ... OK.</div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        
        // Dark Mode Map
        const map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        let marker = null;

        function log(msg, color = 'text-gray-500') {
            const term = document.getElementById('terminal');
            const div = document.createElement('div');
            div.className = color;
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            term.appendChild(div);
            term.scrollTop = term.scrollHeight;
        }

        async function vivisectIP() {
            const ip = document.getElementById('ip-input').value;
            if(!ip) return;

            log(`INITIATING TRACE ON ${ip}...`, 'text-cyan-500');
            log(`SATURATING AVX-512 LANES FOR PATTERN MATCHING...`, 'text-gray-600');

            try {
                // Using a public API for demo, but AETERNA would use its own cluster logic
                const response = await fetch(`https://ipapi.co/${ip}/json/`);
                const data = await response.json();

                if(data.error) throw new Error(data.reason);

                log(`SIGNAL RECOVERED. COORDINATES: ${data.latitude}, ${data.longitude}`, 'text-green-500');
                log(`IDENTIFIED HOSTING: ${data.org}`, 'text-cyan-400');
                log(`CROSS-REFERENCING CLUSTER AXIOMS... 100% MATCH.`, 'text-green-500');

                // Update Metadata
                document.getElementById('metadata').innerHTML = `
                    <div class="flex justify-between border-b border-white/5 pb-2">
                        <span class="text-gray-600">STATUS</span>
                        <span class="text-green-500 font-bold">VIVISECTED</span>
                    </div>
                    <div class="flex justify-between border-b border-white/5 pb-2">
                        <span class="text-gray-600">HOSTING</span>
                        <span class="text-white font-bold">${data.org}</span>
                    </div>
                    <div class="flex justify-between border-b border-white/5 pb-2">
                        <span class="text-gray-600">ASN</span>
                        <span class="text-white font-bold">${data.asn}</span>
                    </div>
                    <div class="flex justify-between border-b border-white/5 pb-2">
                        <span class="text-gray-600">CERTAINTY</span>
                        <span class="text-cyan-500 font-bold">100.00%</span>
                    </div>
                `;

                // Update Map
                const coords = [data.latitude, data.longitude];
                map.flyTo(coords, 10);
                
                if(marker) map.removeLayer(marker);
                marker = L.marker(coords).addTo(map)
                    .bindPopup(`<b class="mono text-black">${ip}</b><br><span class="mono text-black">${data.org}</span>`)
                    .openPopup();

            } catch (err) {
                log(`ERROR: ${err.message}`, 'text-red-500');
            }
        }
    </script>
</body>
</html>
